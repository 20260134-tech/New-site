<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Cyber Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
            background-color: #060810;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .neon-text-blue {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
        }
        .neon-text-pink {
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.4);
        }
        .glass-panel {
            background: rgba(12, 16, 28, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.25);
        }
        .control-btn {
            background: rgba(10, 20, 38, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
            transition: all 0.1s ease;
        }
        .control-btn:active {
            transform: scale(0.92);
            background: rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
        }
    </style>
</head>
<body class="relative w-full h-screen overflow-hidden select-none">

    <!-- HUD Layer -->
    <div id="hud" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10 flex flex-col justify-between p-3 md:p-6">
        <!-- Top Stats Bar -->
        <div class="flex justify-between items-center w-full max-w-4xl mx-auto">
            <!-- Score & Distance -->
            <div class="glass-panel rounded-2xl px-4 py-2.5 md:px-5 md:py-3 flex items-center space-x-4 md:space-x-6 shadow-xl">
                <div>
                    <div class="text-[10px] md:text-xs text-cyan-400 font-bold uppercase tracking-wider">SCORE</div>
                    <div id="scoreDisplay" class="text-xl md:text-3xl font-black text-white neon-text-blue">0</div>
                </div>
                <div class="h-7 w-px bg-cyan-800/80"></div>
                <div>
                    <div class="text-[10px] md:text-xs text-pink-400 font-bold uppercase tracking-wider">DISTANCE</div>
                    <div id="distDisplay" class="text-lg md:text-2xl font-black text-white">0m</div>
                </div>
            </div>

            <!-- Speed & Shield -->
            <div class="glass-panel rounded-2xl px-4 py-2.5 md:px-5 md:py-3 flex items-center space-x-4 md:space-x-6 shadow-xl">
                <div class="text-right">
                    <div class="text-[10px] md:text-xs text-cyan-400 font-bold uppercase tracking-wider">SPEED</div>
                    <div id="speedDisplay" class="text-lg md:text-2xl font-black text-cyan-300">80 km/h</div>
                </div>
                <div class="h-7 w-px bg-cyan-800/80"></div>
                <div>
                    <div class="text-[10px] md:text-xs text-pink-400 font-bold uppercase tracking-wider mb-1">SHIELD</div>
                    <div class="flex space-x-1.5" id="hpContainer">
                        <div class="w-3.5 h-5 md:w-4 md:h-6 rounded bg-pink-500 shadow-md shadow-pink-500/50"></div>
                        <div class="w-3.5 h-5 md:w-4 md:h-6 rounded bg-pink-500 shadow-md shadow-pink-500/50"></div>
                        <div class="w-3.5 h-5 md:w-4 md:h-6 rounded bg-pink-500 shadow-md shadow-pink-500/50"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- On-Screen Controls (Touch + Mouse) -->
        <div class="w-full max-w-lg mx-auto flex justify-between items-center pb-4 px-2 pointer-events-auto">
            <button id="leftBtn" type="button" class="control-btn w-28 h-20 md:w-36 md:h-24 rounded-2xl flex flex-col items-center justify-center text-cyan-300 font-black active:text-white">
                <span class="text-2xl md:text-3xl">◀</span>
                <span class="text-[10px] md:text-xs tracking-widest mt-1">LEFT</span>
            </button>
            <button id="rightBtn" type="button" class="control-btn w-28 h-20 md:w-36 md:h-24 rounded-2xl flex flex-col items-center justify-center text-cyan-300 font-black active:text-white">
                <span class="text-2xl md:text-3xl">▶</span>
                <span class="text-[10px] md:text-xs tracking-widest mt-1">RIGHT</span>
            </button>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="absolute inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="glass-panel max-w-lg w-full rounded-3xl p-8 text-center border-cyan-500/40 shadow-2xl">
            <div class="inline-block px-4 py-1 rounded-full bg-cyan-500/20 text-cyan-300 text-xs font-bold mb-4 border border-cyan-500/40">3D CYBER RACER</div>
            <h1 class="text-5xl font-black text-white neon-text-blue mb-3 italic tracking-wider">CYBER RUN</h1>
            <p class="text-gray-300 text-sm mb-6 leading-relaxed">
                障害物を避けながらエネルギーコインを獲得し、最長走行記録を目指せ！
            </p>

            <div class="grid grid-cols-2 gap-3 mb-8 text-left text-xs text-gray-300">
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex items-center space-x-2">
                    <span class="bg-cyan-500/20 text-cyan-300 font-bold px-2 py-1 rounded">◀ / A</span>
                    <span>左へレーン移動</span>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex items-center space-x-2">
                    <span class="bg-cyan-500/20 text-cyan-300 font-bold px-2 py-1 rounded">▶ / D</span>
                    <span>右へレーン移動</span>
                </div>
            </div>

            <button id="startBtn" type="button" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-400 via-teal-400 to-pink-500 text-slate-950 font-black text-xl tracking-widest transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-lg shadow-cyan-500/30 pointer-events-auto">
                DRIVE NOW
            </button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="hidden absolute inset-0 z-30 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
        <div class="glass-panel max-w-md w-full rounded-3xl p-8 text-center border-pink-500/40 shadow-2xl">
            <h1 class="text-4xl font-black text-pink-500 neon-text-pink mb-2 tracking-widest">CRASHED!</h1>
            <p class="text-gray-400 text-sm mb-6">マシンが大破しました</p>

            <div class="bg-slate-900/80 rounded-2xl p-5 mb-6 border border-slate-800 space-y-3">
                <div class="flex justify-between items-center text-gray-300">
                    <span>最終スコア</span>
                    <span id="finalScore" class="text-2xl font-bold text-cyan-300">0</span>
                </div>
                <div class="flex justify-between items-center text-gray-300">
                    <span>走行距離</span>
                    <span id="finalDistance" class="text-lg font-bold text-pink-400">0m</span>
                </div>
                <div class="flex justify-between items-center text-gray-300">
                    <span>獲得コイン</span>
                    <span id="finalCoins" class="text-lg font-bold text-yellow-400">0</span>
                </div>
            </div>

            <button id="restartBtn" type="button" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-pink-500 hover:from-cyan-400 hover:to-pink-400 text-black font-black text-lg tracking-wider transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-lg shadow-pink-500/30 pointer-events-auto">
                RETRY GAME
            </button>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let playerCar, playerWheels = [];
        let road;
        let obstacles = [];
        let coins = [];
        let sceneryObjects = [];
        let dustParticles;

        const LANES = [-3.5, 0, 3.5];
        let currentLane = 1; // 0: Left, 1: Center, 2: Right
        let targetX = LANES[1];

        // Game State Variables
        let gameRunning = false;
        let score = 0;
        let coinCount = 0;
        let distance = 0;
        let health = 3;
        let baseSpeed = 0.8;
        let currentSpeed = baseSpeed;
        let gameTime = 0;

        function initThree() {
            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x060810);
                scene.fog = new THREE.FogExp2(0x060810, 0.015);

                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 3.8, 7.5);
                camera.lookAt(0, 1.2, -10);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.body.appendChild(renderer.domElement);

                setupLighting();
                createEnvironment();
                createPlayerCar();
                createDustParticles();

                window.addEventListener('resize', onWindowResize);
                setupInput();
            } catch (err) {
                console.error("Three.js initialization error:", err);
            }
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            dirLight.shadow.camera.left = -15;
            dirLight.shadow.camera.right = 15;
            dirLight.shadow.camera.top = 15;
            dirLight.shadow.camera.bottom = -15;
            scene.add(dirLight);

            const blueLight = new THREE.PointLight(0x00f3ff, 2, 35);
            blueLight.position.set(-10, 5, -20);
            scene.add(blueLight);

            const pinkLight = new THREE.PointLight(0xff007f, 2, 35);
            pinkLight.position.set(10, 5, -40);
            scene.add(pinkLight);
        }

        function createEnvironment() {
            const roadGeo = new THREE.PlaneGeometry(12, 300);
            const roadMat = new THREE.MeshStandardMaterial({
                color: 0x11131d,
                roughness: 0.8,
                metalness: 0.2
            });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0, -100);
            road.receiveShadow = true;
            scene.add(road);

            const gridHelper = new THREE.GridHelper(300, 60, 0x00f3ff, 0x1d283a);
            gridHelper.position.set(0, 0.02, -100);
            scene.add(gridHelper);

            const curbGeo = new THREE.BoxGeometry(0.4, 0.3, 300);
            const leftCurb = new THREE.Mesh(curbGeo, new THREE.MeshBasicMaterial({ color: 0x00f3ff }));
            leftCurb.position.set(-6.2, 0.15, -100);
            scene.add(leftCurb);

            const rightCurb = new THREE.Mesh(curbGeo, new THREE.MeshBasicMaterial({ color: 0xff007f }));
            rightCurb.position.set(6.2, 0.15, -100);
            scene.add(rightCurb);

            for (let z = 20; z > -250; z -= 15) {
                createSceneryPillar(-12, z);
                createSceneryPillar(12, z);
            }
        }

        function createSceneryPillar(x, z) {
            const height = 10 + Math.random() * 15;
            const geo = new THREE.BoxGeometry(3, height, 3);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x0d111a,
                roughness: 0.5,
                metalness: 0.8
            });
            const pillar = new THREE.Mesh(geo, mat);
            pillar.position.set(x, height / 2, z);
            pillar.castShadow = true;
            scene.add(pillar);
            sceneryObjects.push(pillar);

            const stripGeo = new THREE.BoxGeometry(3.1, 0.4, 3.1);
            const stripMat = new THREE.MeshBasicMaterial({ color: x < 0 ? 0x00f3ff : 0xff007f });
            const strip = new THREE.Mesh(stripGeo, stripMat);
            strip.position.set(x, height * 0.7, z);
            scene.add(strip);
            sceneryObjects.push(strip);
        }

        function createPlayerCar() {
            playerCar = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x0e1526,
                metalness: 0.9,
                roughness: 0.2
            });
            const accentMat = new THREE.MeshStandardMaterial({
                color: 0x00f3ff,
                emissive: 0x00f3ff,
                emissiveIntensity: 0.6
            });
            const glassMat = new THREE.MeshStandardMaterial({
                color: 0x000000,
                roughness: 0.1,
                metalness: 1.0,
                transparent: true,
                opacity: 0.8
            });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
            const rimMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });

            // Car Body Structure
            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 3.6), bodyMat);
            mainBody.position.y = 0.4;
            mainBody.castShadow = true;
            playerCar.add(mainBody);

            const hood = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.35, 1.2), bodyMat);
            hood.position.set(0, 0.45, -1.2); // Facing Forward (-Z)
            hood.castShadow = true;
            playerCar.add(hood);

            const roof = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.5), glassMat);
            roof.position.set(0, 0.85, 0.1);
            roof.castShadow = true;
            playerCar.add(roof);

            // Front Lights (-Z Direction)
            const headLightMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            const headLightGeo = new THREE.BoxGeometry(0.4, 0.15, 0.1);

            const leftHeadlight = new THREE.Mesh(headLightGeo, headLightMat);
            leftHeadlight.position.set(-0.65, 0.45, -1.81);
            playerCar.add(leftHeadlight);

            const rightHeadlight = new THREE.Mesh(headLightGeo, headLightMat);
            rightHeadlight.position.set(0.65, 0.45, -1.81);
            playerCar.add(rightHeadlight);

            const spotLight = new THREE.SpotLight(0x00f3ff, 3, 25, Math.PI / 6, 0.5);
            spotLight.position.set(0, 0.5, -1.8);
            spotLight.target.position.set(0, 0, -20);
            playerCar.add(spotLight);
            playerCar.add(spotLight.target);

            // Tail Light (+Z Direction)
            const tailLight = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0055 }));
            tailLight.position.set(0, 0.5, 1.81);
            playerCar.add(tailLight);

            // Neon Side Strips
            const neonStripGeo = new THREE.BoxGeometry(0.05, 0.08, 3.0);
            const leftNeon = new THREE.Mesh(neonStripGeo, accentMat);
            leftNeon.position.set(-0.92, 0.25, 0);
            playerCar.add(leftNeon);

            const rightNeon = new THREE.Mesh(neonStripGeo, accentMat);
            rightNeon.position.set(0.92, 0.25, 0);
            playerCar.add(rightNeon);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.25, 16);
            wheelGeo.rotateZ(Math.PI / 2);

            const wheelPositions = [
                { x: -0.95, y: 0.32, z: -1.1 },
                { x: 0.95, y: 0.32, z: -1.1 },
                { x: -0.95, y: 0.32, z: 1.1 },
                { x: 0.95, y: 0.32, z: 1.1 }
            ];

            playerWheels = [];
            wheelPositions.forEach(function(pos) {
                const wheelGroup = new THREE.Group();
                const wheelMesh = new THREE.Mesh(wheelGeo, wheelMat);
                wheelMesh.castShadow = true;
                wheelGroup.add(wheelMesh);

                const rim = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.1), rimMat);
                rim.position.x = pos.x > 0 ? 0.13 : -0.13;
                wheelGroup.add(rim);

                wheelGroup.position.set(pos.x, pos.y, pos.z);
                playerCar.add(wheelGroup);
                playerWheels.push(wheelGroup);
            });

            playerCar.position.set(LANES[currentLane], 0, 0);
            scene.add(playerCar);
        }

        function isPositionClear(laneIndex, targetZ, minDistance) {
            const minDist = minDistance || 14;
            const xPos = LANES[laneIndex];

            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                if (Math.abs(obs.position.x - xPos) < 0.5 && Math.abs(obs.position.z - targetZ) < minDist) {
                    return false;
                }
            }

            for (let j = 0; j < coins.length; j++) {
                const c = coins[j];
                if (Math.abs(c.position.x - xPos) < 0.5 && Math.abs(c.position.z - targetZ) < minDist) {
                    return false;
                }
            }

            return true;
        }

        function spawnObstacle() {
            const laneIndex = Math.floor(Math.random() * 3);
            const zPos = -130;

            if (!isPositionClear(laneIndex, zPos, 16)) return;

            const isEnemyCar = Math.random() > 0.4;
            let obstacleMesh;

            if (isEnemyCar) {
                obstacleMesh = new THREE.Group();
                const carMat = new THREE.MeshStandardMaterial({ color: 0xd90429, roughness: 0.3 });
                const main = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 3.2), carMat);
                main.position.y = 0.4;
                obstacleMesh.add(main);

                const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.5, 1.4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
                cabin.position.set(0, 0.8, -0.2);
                obstacleMesh.add(cabin);

                const lightMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
                const lightGeo = new THREE.BoxGeometry(0.3, 0.15, 0.1);
                const l1 = new THREE.Mesh(lightGeo, lightMat);
                l1.position.set(-0.55, 0.45, 1.61);
                const l2 = new THREE.Mesh(lightGeo, lightMat);
                l2.position.set(0.55, 0.45, 1.61);
                obstacleMesh.add(l1);
                obstacleMesh.add(l2);

                obstacleMesh.userData = { radius: 1.1 };
            } else {
                const blockGeo = new THREE.BoxGeometry(2.2, 1.0, 1.0);
                const blockMat = new THREE.MeshStandardMaterial({
                    color: 0xff0055,
                    emissive: 0x660022,
                    roughness: 0.4
                });
                obstacleMesh = new THREE.Mesh(blockGeo, blockMat);
                obstacleMesh.position.y = 0.5;
                obstacleMesh.userData = { radius: 1.0 };
            }

            obstacleMesh.position.set(LANES[laneIndex], obstacleMesh.position.y, zPos);
            scene.add(obstacleMesh);
            obstacles.push(obstacleMesh);
        }

        function spawnCoin() {
            const availableLanes = [0, 1, 2].filter(function(laneIdx) {
                return isPositionClear(laneIdx, -130, 14);
            });
            if (availableLanes.length === 0) return;

            const laneIndex = availableLanes[Math.floor(Math.random() * availableLanes.length)];
            const zPos = -130;

            const coinGroup = new THREE.Group();
            const coinGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16);
            const coinMat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                metalness: 0.9,
                roughness: 0.1,
                emissive: 0xffa500,
                emissiveIntensity: 0.4
            });

            const coinMesh = new THREE.Mesh(coinGeo, coinMat);
            coinMesh.rotation.x = Math.PI / 2;
            coinGroup.add(coinMesh);

            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(0.6, 0.03, 8, 24),
                new THREE.MeshBasicMaterial({ color: 0xffea00 })
            );
            coinGroup.add(ring);

            coinGroup.position.set(LANES[laneIndex], 0.8, zPos);
            scene.add(coinGroup);
            coins.push(coinGroup);
        }

        function createDustParticles() {
            const particleCount = 60;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 12;
                positions[i + 1] = Math.random() * 2;
                positions[i + 2] = -Math.random() * 100;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            dustParticles = new THREE.Points(
                geometry,
                new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.15, transparent: true, opacity: 0.6 })
            );
            scene.add(dustParticles);
        }

        function setupInput() {
            window.addEventListener('keydown', function(e) {
                if (!gameRunning) return;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    moveLane(-1);
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    moveLane(1);
                }
            });

            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');

            function triggerLeft(e) {
                e.preventDefault();
                if (gameRunning) moveLane(-1);
            }

            function triggerRight(e) {
                e.preventDefault();
                if (gameRunning) moveLane(1);
            }

            leftBtn.addEventListener('pointerdown', triggerLeft);
            rightBtn.addEventListener('pointerdown', triggerRight);

            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
        }

        function moveLane(dir) {
            currentLane = Math.max(0, Math.min(2, currentLane + dir));
            targetX = LANES[currentLane];
        }

        let spawnTimer = 0;
        let coinTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (gameRunning) {
                gameTime += 0.016;
                currentSpeed = baseSpeed + (gameTime * 0.015);

                distance += Math.floor(currentSpeed * 2);
                score += Math.floor(currentSpeed);
                updateHUD();

                // Smooth Car Lane Transition
                playerCar.position.x += (targetX - playerCar.position.x) * 0.22;
                
                // Steering Tilt
                const bankAngle = (playerCar.position.x - targetX) * 0.12;
                playerCar.rotation.z = bankAngle;
                playerCar.rotation.y = -bankAngle * 0.4;

                // Wheel Rotation
                playerWheels.forEach(function(w) {
                    w.rotation.x -= currentSpeed * 0.5;
                });

                // Environment Movement
                sceneryObjects.forEach(function(obj) {
                    obj.position.z += currentSpeed;
                    if (obj.position.z > 20) {
                        obj.position.z -= 270;
                    }
                });

                // Particle Movement
                const positions = dustParticles.geometry.attributes.position.array;
                for (let i = 2; i < positions.length; i += 3) {
                    positions[i] += currentSpeed * 2;
                    if (positions[i] > 10) {
                        positions[i] = -100;
                    }
                }
                dustParticles.geometry.attributes.position.needsUpdate = true;

                // Spawning Timers
                spawnTimer += currentSpeed;
                if (spawnTimer > 16) {
                    spawnObstacle();
                    spawnTimer = 0;
                }

                coinTimer += currentSpeed;
                if (coinTimer > 10) {
                    spawnCoin();
                    coinTimer = 0;
                }

                // Update & Detect Obstacle Collisions
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z += currentSpeed;

                    const distZ = Math.abs(obs.position.z - playerCar.position.z);
                    const distX = Math.abs(obs.position.x - playerCar.position.x);

                    if (distZ < 1.8 && distX < 1.1) {
                        triggerCrash();
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        continue;
                    }

                    if (obs.position.z > 15) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Update & Detect Coin Collections
                for (let j = coins.length - 1; j >= 0; j--) {
                    const c = coins[j];
                    c.position.z += currentSpeed;
                    c.rotation.y += 0.06;

                    const distZ = Math.abs(c.position.z - playerCar.position.z);
                    const distX = Math.abs(c.position.x - playerCar.position.x);

                    if (distZ < 1.5 && distX < 1.0) {
                        score += 300;
                        coinCount++;
                        scene.remove(c);
                        coins.splice(j, 1);

                        const scoreElem = document.getElementById('scoreDisplay');
                        scoreElem.classList.add('text-yellow-300');
                        setTimeout(function() {
                            scoreElem.classList.remove('text-yellow-300');
                        }, 150);
                        continue;
                    }

                    if (c.position.z > 15) {
                        scene.remove(c);
                        coins.splice(j, 1);
                    }
                }
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function triggerCrash() {
            health--;
            updateHUD();

            const origY = camera.position.y;
            camera.position.y += 0.4;
            setTimeout(function() {
                camera.position.y = origY;
            }, 100);

            if (health <= 0) {
                gameOver();
            }
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('distDisplay').innerText = Math.floor(distance / 10) + 'm';
            document.getElementById('speedDisplay').innerText = Math.floor(currentSpeed * 100) + ' km/h';

            const hpContainer = document.getElementById('hpContainer');
            hpContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const bar = document.createElement('div');
                bar.className = 'w-3.5 h-5 md:w-4 md:h-6 rounded ' + (i < health ? 'bg-pink-500 shadow-md shadow-pink-500/50' : 'bg-gray-800');
                hpContainer.appendChild(bar);
            }
        }

        function startGame() {
            score = 0;
            coinCount = 0;
            distance = 0;
            health = 3;
            gameTime = 0;
            currentSpeed = baseSpeed;
            currentLane = 1;
            targetX = LANES[1];
            if (playerCar) playerCar.position.x = targetX;

            obstacles.forEach(function(o) { scene.remove(o); });
            coins.forEach(function(c) { scene.remove(c); });
            obstacles = [];
            coins = [];

            updateHUD();

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            gameRunning = true;
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalDistance').innerText = Math.floor(distance / 10) + 'm';
            document.getElementById('finalCoins').innerText = coinCount;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            initThree();
            animate();
        });
    </script>
</body>
</html>
